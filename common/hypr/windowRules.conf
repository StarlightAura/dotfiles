#                                    !!WINDOW RULES!!                               #
# --------------------------------------------------------------------------------- #
#                                    !!WINDOW RULES!!                               #


# -- Some of my personally preferred window rules, you will probably like these as well! ---%
# -- There's also lots of bug-fixes for specific apps here.                              ---%

# Read https://wiki.hyprland.org/Configuring/Window-Rules/ for more info
# Read https://wiki.hyprland.org/Configuring/Workspace-Rules/  for more info


# I want certain apps to be floating by default when starting them.
# You can copy/paste this format and add your own preferred applications.
##windowrule = float, class:^(kitty)$
windowrule = float, class:^(waypaper)$

##windowrule = size 940 925, class:^(caja)$
##windowrule = float, class:^(caja)$

windowrule = size 700 600, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$

windowrule = float, class:^(qalculate-gtk)$



#--------------------------------------------------------------------
# Workspace rules to make certain apps launch in dedicated workspaces
#--------------------------------------------------------------------
# Make VSCodium go to its workspace
windowrulev2 = workspace special:hexenzirkel, class:(zen)
# Make games running under gamescope go to its workspace
windowrulev2 = workspace special:game, class:(gamescope)
windowrulev2 = workspace special:game, class:(factorio)
# Make Obsidian go to its workspace
windowrulev2 = workspace special:obsidian, class:(obsidian)
#Make telegram go to its workspace
# windowrulev2 = workspace special:hidden2, class:(64gram-desktop)
windowrulev2 = workspace special:music, class:(music)
#--------------------------------------------------------------



#--------------------------------------------------------------
# JetBrains Fixes
#--------------------------------------------------------------
windowrulev2 = noinitialfocus, class:jetbrains-toolbox, floating:0
windowrulev2 = noinitialfocus, class:(jetbrains-)(.*), floating:0
windowrulev2 = noinitialfocus, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:0
windowrulev2 = center, class:(jetbrains-)(.*), initialTitle:(.+), floating:0
windowrulev2 = center, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:0
windowrulev2 = noinitialfocus, class:(jetbrains-) (.*), title:^win(.*), initialTitle:win.*, floating:0



# Add blur to waybar
layerrule = blur, waybar
layerrule = blurpopups, waybar
layerrule = ignorealpha 0.7, waybar

layerrule = blur, wofi
layerrule = blurpopups, wofi
layerrule = ignorealpha 0.7, wofi


# Fix dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0