#--------------------------------------------------------------
# Switch current workspaces with mainMod + [0-9]
#--------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
#--------------------------------------------------------------
bind = $mainMod, KP_End, workspace, 11 # Open workspace 11
bind = $mainMod, KP_Down, workspace, 12 # Open workspace 12
bind = $mainMod, KP_Next, workspace, 13 # Open workspace 13
bind = $mainMod, KP_Left, workspace, 14 # Open workspace 14
bind = $mainMod, KP_Begin, workspace, 15 # Open workspace 15
bind = $mainMod, KP_Right, workspace, 16 # Open workspace 16
bind = $mainMod, KP_Home, workspace, 17 # Open workspace 17
bind = $mainMod, KP_Up, workspace, 18 # Open workspace 18
bind = $mainMod, KP_Prior, workspace, 19 # Open workspace 19
bind = $mainMod, KP_Insert, workspace, 20 # Open workspace 20
#--------------------------------------------------------------
bind = $mainMod, F1, workspace, 21
bind = $mainMod, F2, workspace, 22
bind = $mainMod, F3, workspace, 23
bind = $mainMod, F4, workspace, 24
bind = $mainMod, F5, workspace, 25
bind = $mainMod, F6, workspace, 26
bind = $mainMod, F7, workspace, 27
bind = $mainMod, F8, workspace, 28
bind = $mainMod, F9, workspace, 29
bind = $mainMod, F10, workspace, 30
#--------------------------------------------------------------



#--------------------------------------------------------------
# Move a focused window to a workspace with mainMod + SHIFT + [0-9]
#--------------------------------------------------------------
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
#--------------------------------------------------------------
bind = $mainMod SHIFT, KP_End, movetoworkspace, 11 # Move active window to workspace 11
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 12 # Move active window to workspace 12
bind = $mainMod SHIFT, KP_Next, movetoworkspace, 13 # Move active window to workspace 13
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 14 # Move active window to workspace 14
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 15 # Move active window to workspace 15
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 16 # Move active window to workspace 16
bind = $mainMod SHIFT, KP_Home, movetoworkspace, 17 # Move active window to workspace 17
bind = $mainMod SHIFT, KP_Up, movetoworkspace, 18 # Move active window to workspace 18
bind = $mainMod SHIFT, KP_Prior, movetoworkspace, 19 # Move active window to workspace 19
bind = $mainMod SHIFT, KP_Insert, movetoworkspace, 20 # Move active window to workspace 20
# ----------------------------------------------------- 
bind = $mainMod SHIFT, F1, movetoworkspace, 21
bind = $mainMod SHIFT, F2, movetoworkspace, 22
bind = $mainMod SHIFT, F3, movetoworkspace, 23
bind = $mainMod SHIFT, F4, movetoworkspace, 24
bind = $mainMod SHIFT, F5, movetoworkspace, 25
bind = $mainMod SHIFT, F6, movetoworkspace, 26
bind = $mainMod SHIFT, F7, movetoworkspace, 27
bind = $mainMod SHIFT, F8, movetoworkspace, 28
bind = $mainMod SHIFT, F9, movetoworkspace, 29
bind = $mainMod SHIFT, F10, movetoworkspace, 30
#--------------------------------------------------------------



#--------------------------------------------------------------
# Special workspaces
#--------------------------------------------------------------
bind = $mainMod ALT, F11, togglespecialworkspace, hidden1
bind = $mainMod ALT, F12, togglespecialworkspace, hidden2
bind = $mainMod, KP_Delete, togglespecialworkspace, horny # Toggle workspace for zen browser, for horny stuff.
bind = $mainMod, G, togglespecialworkspace, game # Toggle workspace for games
bind = $mainMod, ordmasculine, togglespecialworkspace, obsidian
#--------------------------------------------------------------
bind = $mainMod SHIFT, F11, movetoworkspace, special:hidden1
bind = $mainMod SHIFT, F12, movetoworkspace, special:hidden2
bind = $mainMod SHIFT, KP_Delete, movetoworkspace, special:horny
bind = $mainMod SHIFT, G, movetoworkspace, special:game
bind = $mainMod SHIFT, ordmasculine, movetoworkspace, special:obsidian
#--------------------------------------------------------------



#--------------------------------------------------------------
# Scrolling keybinds
#--------------------------------------------------------------
# mod + scroll wheel to traverse the workspace, currently buggy
#bind = $mainMod, mouse_down, layoutmsg, move +200
#bind = $mainMod, mouse_up, layoutmsg, move -200
#--------------------------------------------------------------
bind = $mainMod SHIFT, left, layoutmsg, swapcol l
bind = $mainMod SHIFT, right, layoutmsg, swapcol r
bind = $mainMod CONTROL, left, layoutmsg, colresize -0.2
bind = $mainMod CONTROL, right, layoutmsg, colresize +0.2
#--------------------------------------------------------------
#bind = $mainMod, <, submap, traverse
#--------------------------------------------------------------
submap = traverse

bind = $mainMod, right, layoutmsg, move +200
bind = $mainMod, left, layoutmsg, move -200
bind = $mainMod, <, submap, reset
submap = reset
#--------------------------------------------------------------
bind = $mainMod, Y, layoutmsg, togglefit




#--------------------------------------------------------------------
# Workspace rules to make certain apps launch in dedicated workspaces
#--------------------------------------------------------------------
# Make VSCodium go to its workspace
windowrulev2 = workspace special:horny, class:(zen)
# Make games running under gamescope go to its workspace
windowrulev2 = workspace special:game, class:(gamescope)
windowrulev2 = workspace special:game, class:(factorio)
# Make Obsidian go to its workspace
windowrulev2 = workspace special:obsidian, class:(obsidian)
#Make telegram go to its workspace
windowrulev2 = workspace special:hidden2, class:(64gram-desktop) #doesn't work. why
#--------------------------------------------------------------



#--------------------------------------------------------------
# Reserve 5 permanent workspaces per monitor + 4 for the tab when it's active
#--------------------------------------------------------------
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
#--------------------------------------------------------------
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1
#--------------------------------------------------------------
workspace = 11, monitor:DP-2
workspace = 12, monitor:DP-2
workspace = 13, monitor:DP-2
workspace = 14, monitor:DP-2
workspace = 15, monitor:DP-2
#--------------------------------------------------------------
workspace = 25, monitor:TAB
workspace = 26, monitor:TAB
workspace = 27, monitor:TAB
workspace = 28, monitor:TAB
#--------------------------------------------------------------



#--------------------------------------------------------------
# Movement
#--------------------------------------------------------------
# Move focus to nearby windows
bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down

# Move between workspaces
bind = $mainMod, Tab, workspace, m+1 # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace

# Move and Resize windows with mainMod + LMB/RMB and dragging, drag on edges to resize.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86Calculator, exec, qalculate-gtk
#--------------------------------------------------------------



#--------------------------------------------------------------
# JetBrains Fixes
#--------------------------------------------------------------
windowrulev2 = noinitialfocus, class:jetbrains-toolbox, floating:0
windowrulev2 = noinitialfocus, class:(jetbrains-)(.*), floating:0
windowrulev2 = noinitialfocus, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:0
windowrulev2 = center, class:(jetbrains-)(.*), initialTitle:(.+), floating:0
windowrulev2 = center, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:0
windowrulev2 = noinitialfocus, class:(jetbrains-) (.*), title:^win(.*), initialTitle:win.*, floating:0